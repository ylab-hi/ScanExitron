[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanexitron"
version = "1.3.1"
description = "A computational workflow for exitron splicing identification from RNA-Seq data"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ting-You Wang", email = "tywang@northwestern.edu" },
]
keywords = ["bioinformatics", "RNA-seq", "exitron", "splicing", "genomics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
requires-python = ">=3.10"
dependencies = [
    "pyfaidx>=0.7",
    "numpy>=1.21",
    "htseq>=2.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/ylab-hi/ScanExitron"
Repository = "https://github.com/ylab-hi/ScanExitron"
"Bug Tracker" = "https://github.com/ylab-hi/ScanExitron/issues"

[project.scripts]
scanexitron = "scanexitron.cli:main"
exitron2vcf = "scanexitron.cli:vcf_main"

[tool.hatch.build.targets.wheel]
packages = ["src/scanexitron"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
